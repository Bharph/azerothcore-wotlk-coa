name: windows-build

on:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    name: Windows Release Build
    env:
      BOOST_ROOT: C:\local\boost_1_87_0

    steps:
      - uses: actions/checkout@v7

      - name: Cache Boost & MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9

      - name: Configure OS (Boost + MySQL + OpenSSL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Boost 1.87.0 (msvc-14.3, 64-bit) prebuilt binaries -> C:\local\boost_1_87_0
          if (-not (Test-Path 'C:\local\boost_1_87_0\boost')) {
              $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
              $boostUrl = 'https://downloads.sourceforge.net/project/boost/boost-binaries/' +
                  '1.87.0/boost_1_87_0-msvc-14.3-64.exe'
              $boostAttempts = 3
              for ($attempt = 1; $attempt -le $boostAttempts; $attempt++) {
                  try {
                      Invoke-WebRequest -Uri $boostUrl -OutFile $boostExe -UserAgent 'azerothcore-ci' `
                          -ConnectionTimeoutSeconds 60 -OperationTimeoutSeconds 60
                      $boostMB = (Get-Item $boostExe).Length / 1MB
                      if ($boostMB -lt 50) { throw "got $([int]$boostMB) MB - likely an HTML error page." }
                      break
                  } catch {
                      Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
                      if ($attempt -eq $boostAttempts) { throw }
                      Start-Sleep -Seconds 15
                  }
              }
              $proc = Start-Process -FilePath $boostExe `
                  -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' `
                  -Wait -PassThru
              if ($proc.ExitCode -ne 0) { throw "Boost installer failed with exit code $($proc.ExitCode)." }
              if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) {
                  throw 'Boost install missing headers.'
              }
          }

          # MySQL 8.4.9 client headers + libs -> C:\tools\mysql\current
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) {
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
              Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' `
                  -OutFile $mysqlZip -UserAgent 'Mozilla/5.0'
              $mysqlMB = (Get-Item $mysqlZip).Length / 1MB
              if ($mysqlMB -lt 50) { throw "MySQL zip too small ($([int]$mysqlMB) MB)." }
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
              if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) {
                  throw 'MySQL client import library not found after extract.'
              }
          }

          # OpenSSL - use the copy pre-installed on the runner image
          $opensslRoot = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
              Select-Object -First 1
          if (-not $opensslRoot) { throw 'No OpenSSL development install found on runner.' }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "OpenSSL: $opensslRoot"

      - name: Build
        shell: bash
        run: |
          export CTOOLS_BUILD=none
          ./acore.sh compiler build

      - name: Find binaries
        shell: bash
        run: |
          echo "=== Searching for worldserver.exe and authserver.exe ==="
          find . -name "worldserver.exe" -o -name "authserver.exe" 2>/dev/null | sort
          echo "=== env/dist/bin contents ==="
          ls env/dist/bin/ 2>/dev/null || echo "(not found at env/dist/bin)"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: worldserver-windows-${{ github.run_number }}
          path: |
            env/dist/bin/worldserver.exe
            env/dist/bin/authserver.exe
            env/dist/bin/*.dll
          if-no-files-found: warn
          retention-days: 30
